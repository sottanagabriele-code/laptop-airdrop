name: Pubblica su Cloudflare

# Ogni modifica su main finisce online da sola: non serve premere Publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Se arrivano due modifiche ravvicinate pubblica solo la piu recente.
concurrency:
  group: pubblicazione
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Raccogli i file del sito
        # Il sito e' un singolo index.html piu' gli asset: niente da compilare.
        # Si copia in dist/ invece di pubblicare la radice, cosi' .git,
        # il workflow e wrangler.toml non finiscono online.
        run: |
          mkdir -p dist
          cp index.html robots.txt sitemap.xml og.png dist/
          ls -la dist

      - name: Pubblica su Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

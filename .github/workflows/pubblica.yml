name: Pubblica su Cloudflare

# Ogni modifica su main finisce online da sola: non serve premere Publish.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      temporaneo:
        description: "Pubblica su un account Cloudflare temporaneo (nessuna credenziale; stampa un link per rivendicarlo)"
        type: boolean
        default: false

# Se arrivano due modifiche ravvicinate pubblica solo la piu recente.
concurrency:
  group: pubblicazione
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Raccogli i file del sito
        # Il sito e' un singolo index.html piu' gli asset: niente da compilare.
        # Si copia in dist/ invece di pubblicare la radice, cosi' .git,
        # il workflow e wrangler.toml non finiscono online.
        run: |
          mkdir -p dist
          cp index.html robots.txt sitemap.xml og.png dist/
          cp ./*.txt dist/ 2>/dev/null || true
          ls -la dist

      - name: Controlla le credenziali Cloudflare
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "pronto=si" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare non configurato"
              echo ""
              echo "Il sito resta online su GitHub Pages."
              echo "Per pubblicare anche su Cloudflare servono due secret in"
              echo "Settings -> Secrets and variables -> Actions:"
              echo ""
              echo "| Secret | Dove prenderlo |"
              echo "|---|---|"
              echo "| \`CLOUDFLARE_API_TOKEN\` | Cloudflare -> My Profile -> API Tokens -> template *Edit Cloudflare Workers* |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | Cloudflare -> Workers & Pages -> barra laterale destra |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pubblica su Cloudflare
        if: steps.cf.outputs.pronto == 'si'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Pubblica su Cloudflare (account temporaneo)
        # Ripiego quando i secret non ci sono: wrangler crea un account
        # temporaneo e stampa un link per rivendicarlo. Serve a vedere il
        # sito su Cloudflare subito; non sostituisce il deploy vero.
        if: steps.cf.outputs.pronto == 'no' && inputs.temporaneo
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --temporary 2>&1 | tee deploy.log
          echo "### Deploy Cloudflare temporaneo" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[a-zA-Z0-9./?=_%:-]*' deploy.log | sort -u >> "$GITHUB_STEP_SUMMARY"

      - name: Segnala l'aggiornamento ai motori di ricerca
        # IndexNow: Bing, Yandex, Seznam, Naver e chi legge il loro indice
        # (DuckDuckGo compreso) ricrawlano su richiesta, senza registrazione.
        # Google non aderisce: per Google serve Search Console, a mano.
        continue-on-error: true
        run: |
          # La chiave e' il file alla radice che ha per nome 32 cifre esadecimali.
          KEY=$(basename "$(ls ./*.txt | grep -E '/[0-9a-f]{32}\.txt$' | head -1)" .txt)
          if [ -z "$KEY" ]; then echo "nessuna chiave IndexNow, salto"; exit 0; fi
          HOST=laptop-airdrop.bluefootprovider.workers.dev
          URL=https://$HOST/
          echo "Segnalo $URL con la chiave $KEY"
          curl -sS -m 30 -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[\"$URL\"]}" \
            -w '\nHTTP %{http_code}\n'

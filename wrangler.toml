# Cloudflare Pages. Il nome del progetto e' anche l'indirizzo pubblico:
# "laptop" -> https://laptop.pages.dev/ — nessun nome account nell'URL,
# a differenza di workers.dev che e' sempre <worker>.<account>.workers.dev.
#
# Se il nome "laptop" risulta gia' preso (i nomi .pages.dev sono unici per
# tutta Cloudflare), cambialo qui e poi lancia:  ./scripts/set-site-url.sh
# che riallinea in un colpo tutti i punti del sito che citano l'indirizzo.
name = "laptop"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Dove finiscono gli USDC incassati. Finche' e' vuoto l'endpoint si dichiara
# chiuso e la pagina non chiede nessuna firma a nessuno.
TREASURY_ADDRESS = ""
BASE_RPC_URL = "https://mainnet.base.org"

# La chiave privata NON sta qui e non sta nel repo:
#   wrangler pages secret put CLAIM_SIGNER_KEY --project-name laptop
